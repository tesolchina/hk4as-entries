      <span class="yr">${d.year}</span>
      <span class="ttl">${d.title || '(untitled)'}</span>
      <span class="cat">${d.category || ''}</span>
      <span class="medal">${d.medal || ''}</span>
    </div>
    <div class="body">
      <div class="board">
        ${d.board ? `<img src="${d.board}" alt="entry board ${d.id}">` : '<p class="empty">無版面圖</p>'}
        ${d.frames.length ? `<div class="lbl">影片關鍵幀（6 張）</div><div class="frames">${d.frames.map(f=>`<img src="${f}">`).join('')}</div>` : ''}
      </div>
      <div>
        ${bm ? `<div class="lbl">版面幾何 + OCR</div><table class="m">${bm}</table>` : ''}
        ${fm ? `<div class="lbl">影片測量</div><table class="m">${fm}</table>` : ''}
        ${d.film_note ? `<div class="lbl">量測備註</div><div class="ocr">${d.film_note}</div>` : ''}
        ${d.film_note ? `<div class="lbl">量測備註</div><div class="ocr">${d.film_note}</div>` : ''}
        ${d.ocr_sample ? `<div class="lbl">OCR 文字（節錄）</div><div class="ocr">${d.ocr_sample.replace(/</g,'&lt;')}</div>` : ''}
      </div>
    </div>`;
  list.appendChild(el);
});
</script>
</body>
</html>
